name: GearWatch Window Research Refresh

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/window-research-refresh.yml'
      - 'scripts/window-research-refresh.mjs'

permissions:
  contents: write

concurrency:
  group: gearwatch-window-research-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh live Window Lab evidence from current causal state
        run: node scripts/window-research-refresh.mjs
      - name: Persist live research ledger
        shell: bash
        run: |
          git config user.name 'gearwatch-bot'
          git config user.email 'gearwatch-bot@users.noreply.github.com'
          git add data/window-research.json
          if git diff --cached --quiet; then
            echo 'Window research already current'
          else
            git commit -m 'data(v4.6): refresh Window Lab live evidence'
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:master
          fi
