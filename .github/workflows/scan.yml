name: GearWatch Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: gearwatch-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect deterministic market data
        run: npm run market

      - name: Run causal mechanism sensors
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-oss-20b:free' }}
        run: npm run scan

      - name: Persist Living Bible state
        run: |
          git config user.name 'gearwatch-bot'
          git config user.email 'gearwatch-bot@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No state changes'
          else
            git commit -m "data: autonomous mechanism scan $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
