name: GearWatch V3 Causal Portfolio Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [master]
    paths:
      - '.gearwatch-run'

permissions:
  contents: write

concurrency:
  group: gearwatch-v3-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-oss-20b' }}
      OPENROUTER_VERIFIER_MODEL: ${{ vars.OPENROUTER_VERIFIER_MODEL || 'openai/gpt-oss-120b' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_INVESTMENT_MODEL: ${{ vars.OPENAI_INVESTMENT_MODEL || 'gpt-5-nano' }}
      TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
      TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
      TRADING212_ENV: ${{ vars.TRADING212_ENV || 'live' }}
      T212_LIVE_TRADING_ENABLED: 'false'
      GEARWATCH_EXECUTION_MODE: 'SHADOW_ONLY'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create immutable run id
        shell: bash
        run: echo "GEARWATCH_RUN_ID=run_$(date -u +'%Y-%m-%dT%H-%M-%SZ')" >> "$GITHUB_ENV"
      - name: Read live OpenRouter quota safely
        run: npm run quota
      - name: Collect daily and intraday market telemetry
        run: npm run market
      - name: Validate investable universe against Trading 212 catalogue
        run: npm run broker
      - name: Refresh cached company fundamentals for financial pass
        run: npm run fundamentals
      - name: Free deterministic news retrieval for all mechanisms
        run: npm run retrieve
      - name: Official upstream sources
        run: npm run upstream
      - name: Sparse web rescue only where free and official retrieval are blind
        run: npm run discover
      - name: Extract facts with reliable low-cost structured model
        run: npm run extract
      - name: Red-team strongest early mechanisms with bounded judge budget
        run: npm run verify
      - name: Cluster events, apply hysteresis, score relative market vote and Alpha Click
        run: npm run assemble
      - name: Update empirical correlation memory
        run: npm run correlate
      - name: Compute Company Transmission 2-pass
        run: npm run transmission
      - name: Build Trading 212 Top 5 and model pie
        run: npm run investment
      - name: Build deterministic $500 shadow portfolio plan
        run: npm run portfolio
      - name: Apply paper fills and rotation journal
        run: npm run paper
      - name: Persist Living Bible, portfolio ledger and all traces
        shell: bash
        run: |
          git config user.name 'gearwatch-bot'
          git config user.email 'gearwatch-bot@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No state changes'
          else
            git commit -m "data(v3): causal portfolio scan ${GEARWATCH_RUN_ID}"
            git push
          fi
