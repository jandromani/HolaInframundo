name: GearWatch V2 CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check JavaScript
        run: |
          for f in scripts/*.mjs; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Parse JSON configuration and state seeds
        run: |
          node -e "for (const f of ['config/mechanisms.json','config/queries.v2.json','config/edges.v2.json','config/policy.v2.json','data/current.json','data/series.json','data/alpha-clicks.json','data/correlation-memory.json','data/budget.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('JSON OK')"
